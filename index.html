<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resona | Vibe-Based Discovery</title>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #050505; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .widget { background: #111; padding: 2.5rem; border-radius: 16px; border: 1px solid #222; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        h2 { margin: 0 0 5px 0; letter-spacing: -0.5px; }
        input { width: 85%; padding: 14px; margin: 20px 0; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 1em; }
        input:focus { outline: none; border-color: #0052FF; }
        button { background: #0052FF; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; width: 100%; transition: background 0.2s; }
        button:hover { background: #0043CC; }
        .results { display: flex; gap: 12px; margin-top: 25px; justify-content: center; flex-wrap: wrap; }
        .results img { width: 140px; height: 140px; object-fit: cover; border-radius: 12px; border: 1px solid #333; }
        .loading { display: none; margin-top: 20px; font-size: 0.9em; color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div class="widget">
        <h2>Resona</h2>
        <p style="color: #888; font-size: 0.9em; margin: 0;">SDK Pilot (Base Network)</p>
        
        <input type="text" id="moodInput" placeholder="How are you feeling right now?">
        <button onclick="discover()">Discover</button>
        
        <div id="loading" class="loading">Translating vibe to vectors...</div>
        <div id="results" class="results"></div>
    </div>

    <script>
        async function discover() {
            const mood = document.getElementById('moodInput').value;
            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');
            
            if (!mood) return;
            
            resultsDiv.innerHTML = '';
            loading.style.display = 'block';

            try {
                const response = await fetch('https://resona-api-yvo6.onrender.com/discover', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mood: mood })
                });
                
                const data = await response.json();
                loading.style.display = 'none';

                if (data.error) {
                    resultsDiv.innerHTML = `<p style="color: #ff4444; font-size: 0.85em;">${data.error}</p>`;
                    return;
                }
                
                data.recommendations.forEach(item => {
                    const img = document.createElement('img');
                    img.src = item.url;
                    img.alt = item.title;
                    img.title = item.title;
                    resultsDiv.appendChild(img);
                });
            } catch (err) {
                loading.style.display = 'none';
                resultsDiv.innerHTML = '<p style="color: #ff4444; font-size: 0.85em;">Connection error. Make sure the API is live.</p>';
            }
        }
    </script>
</body>
</html>
